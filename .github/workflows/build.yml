name: Build mod jar
on:
  push:
    branches: ['build/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.2.1' }
      - run: gradle build --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: buildlog, path: build.log }
      - uses: actions/upload-artifact@v4
        with: { name: jar, path: build/libs/*.jar }
